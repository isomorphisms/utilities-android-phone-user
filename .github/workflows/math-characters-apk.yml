name: Math Characters Android

on:
  pull_request:
    paths:
      - 'math-characters/**'
      - '.github/workflows/math-characters-apk.yml'
  push:
    branches: [main]
    paths:
      - 'math-characters/**'
      - '.github/workflows/math-characters-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build
        run: gradle -p math-characters testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-characters-debug-apk
          path: math-characters/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
