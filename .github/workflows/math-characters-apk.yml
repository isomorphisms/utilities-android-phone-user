name: Programmer's Unicode Pad Android

on:
  pull_request:
    paths:
      - 'math-characters/**'
      - '.github/workflows/math-characters-apk.yml'
  push:
    branches: [main]
    paths:
      - 'math-characters/**'
      - '.github/workflows/math-characters-apk.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Test C model and touch geometry
        run: math-characters/run-host-tests.sh

      - name: Build native APK
        run: math-characters/build-apk.sh

      - name: Verify native APK contract
        run: math-characters/ci/check-apk.sh math-characters/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: programmers-unicode-pad-debug-apk
          path: math-characters/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: programmers-unicode-pad-debug-apk
          path: downloaded-apk

      - name: Launch and exercise native pad
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: math-characters/ci/emulator-smoke.sh downloaded-apk/app-debug.apk /tmp/programmers-unicode-pad.png

      - name: Upload smoke-test screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmers-unicode-pad-smoke-screen
          path: /tmp/programmers-unicode-pad.png
          if-no-files-found: warn
