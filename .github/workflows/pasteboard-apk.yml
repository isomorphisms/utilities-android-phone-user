name: Pasteboard Android

on:
  pull_request:
    paths:
      - 'pasteboard/**'
      - '.github/workflows/pasteboard-apk.yml'
  push:
    branches: [pasteboard]
    paths:
      - 'pasteboard/**'
      - '.github/workflows/pasteboard-apk.yml'

permissions:
  contents: read

jobs:
  idric-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: isomorphisms/Idric
          ref: 58295f6fb49a823c5c0880568b30cff513d42d7b
          path: idric-compiler

      - name: Restore pinned Idriç compiler
        id: idric-cache
        uses: actions/cache@v4
        with:
          path: |
            idric-compiler/.tools
            idric-compiler/bootstrap-build
            idric-compiler/build/exec
          key: idric-${{ runner.os }}-${{ runner.arch }}-58295f6fb49a823c5c0880568b30cff513d42d7b

      - name: Build pinned Idriç compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: idric-compiler/edric bootstrap

      - name: Check Idriç pasteboard contract
        run: |
          PATH="$PWD/idric-compiler/.tools/bin:$PATH" \
          IDRIS2_PATH="$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/prelude-0.8.0:$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/base-0.8.0" \
          IDRIS2_DATA="$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/support" \
          IDRIS2_LIBS="$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/lib" \
          IDRIC_COMPILER="$PWD/idric-compiler/build/exec/idris2" \
          sh pasteboard/check-idric-config.sh

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Test pasteboard model
        run: sh pasteboard/run-host-tests.sh

      - name: Build native APK
        run: sh pasteboard/build-apk.sh

      - name: Verify APK contract
        run: sh pasteboard/ci/check-apk.sh pasteboard/app/build/outputs/apk/debug/pasteboard-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pasteboard-debug-apk
          path: pasteboard/app/build/outputs/apk/debug/pasteboard-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: pasteboard-debug-apk
          path: downloaded-apk

      - name: Launch native pasteboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: sh pasteboard/ci/emulator-smoke.sh downloaded-apk/pasteboard-debug.apk /tmp/pasteboard.png

      - name: Upload smoke-test screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pasteboard-smoke-screen
          path: /tmp/pasteboard.png
          if-no-files-found: warn
