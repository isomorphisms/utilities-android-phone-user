name: Math Characters 0.1.0 prerelease

on:
  push:
    branches:
      - math-characters-v0.1.0-prerelease
    paths:
      - '.github/workflows/math-characters-prerelease.yml'
      - 'math-characters/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build every package variant
        run: |
          gradle -p math-characters \
            testDebugUnitTest \
            assembleDebug bundleDebug \
            assembleRelease bundleRelease \
            --no-daemon

      - name: Stage frozen binaries
        run: |
          set -eux
          mkdir -p prerelease
          cp math-characters/app/build/outputs/apk/debug/app-debug.apk \
            prerelease/math-characters-0.1.0-pre.1-debug.apk
          cp math-characters/app/build/outputs/bundle/debug/app-debug.aab \
            prerelease/math-characters-0.1.0-pre.1-debug.aab
          cp math-characters/app/build/outputs/apk/release/app-release-unsigned.apk \
            prerelease/math-characters-0.1.0-pre.1-release-unsigned.apk
          cp math-characters/app/build/outputs/bundle/release/app-release.aab \
            prerelease/math-characters-0.1.0-pre.1-release-unsigned.aab
          (cd prerelease && sha256sum math-characters-* > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-characters-0.1.0-pre.1
          path: prerelease/*
          if-no-files-found: error

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: math-characters-v0.1.0-pre.1
        run: |
          set -eux
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" prerelease/* --clobber
          else
            gh release create "$TAG" prerelease/* \
              --target "$GITHUB_SHA" \
              --title 'Math Characters 0.1.0 prerelease' \
              --notes-file math-characters/RELEASE_NOTES_0.1.0-pre.1.md \
              --prerelease
          fi
