name: Android clipboard JNI

on:
  pull_request:
    paths:
      - 'android-clipboard/**'
      - '.github/workflows/android-clipboard-jni.yml'
  push:
    branches: [main]
    paths:
      - 'android-clipboard/**'
      - '.github/workflows/android-clipboard-jni.yml'

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check UTF-8 ownership and JNI boundary
        run: android-clipboard/run-host-tests.sh
